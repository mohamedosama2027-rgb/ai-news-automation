name: Daily AI News Automation

concurrency:
  group: ai-news-page-publishing
  cancel-in-progress: false

on:
  schedule:
    - cron: "23 9 * * *"
      timezone: "Africa/Cairo"
    - cron: "7 17 * * *"
      timezone: "Africa/Cairo"
  workflow_dispatch:
    inputs:
      content_mode:
        description: Content type for a manual run
        required: true
        default: TOOLS
        type: choice
        options:
          - TOOLS
          - NEWS

permissions:
  contents: write

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PRODUCT_HUNT_API_TOKEN: ${{ secrets.PRODUCT_HUNT_API_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
      FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
      FACEBOOK_USER_ACCESS_TOKEN: ${{ secrets.FACEBOOK_USER_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      MAX_POSTS_PER_RUN: 1
      PEXELS_PER_PAGE: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Choose content mode and focus for this time slot
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
          DISPATCH_MODE: ${{ inputs.content_mode }}
        run: |
          case "$SCHEDULE_CRON" in
            "23 9 * * *") mode="NEWS"; topic="AI_FINANCE,AI_BUSINESS" ;;
            "7 17 * * *") mode="TOOLS"; topic="AI_BUSINESS_TOOLS,AI_MARKETING_TOOLS,AI_PRODUCTIVITY_TOOLS,AI_FINANCE_TOOLS,AI_RETAIL_TOOLS,AI_HR_TOOLS" ;;
            "")
              mode="$DISPATCH_MODE"
              topic=""
              ;;
            *) echo "Unknown schedule: $SCHEDULE_CRON" >&2; exit 1 ;;
          esac
          if [[ "$mode" != "NEWS" && "$mode" != "TOOLS" ]]; then
            echo "Invalid content mode: $mode" >&2
            exit 1
          fi
          echo "Selected content mode: $mode"
          echo "POST_CONTENT_MODE=$mode" >> "$GITHUB_ENV"
          echo "POST_TOPIC_CATEGORIES=$topic" >> "$GITHUB_ENV"

      - name: Run automation
        run: npm start

      - name: Save published news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/sync-published-news.js
